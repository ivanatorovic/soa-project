syntax = "proto3";

option csharp_namespace = "follower_service.Grpc";
option java_package = "com.soa.blog_service.grpc";
option java_multiple_files = true;

package followers;

service FollowCheckerService {
  rpc IsFollowing (IsFollowingRequest) returns (IsFollowingReply) {}
  rpc GetFollowing (GetFollowingRequest) returns (GetFollowingReply) {}
}

message IsFollowingRequest {
  int64 followerId = 1;
  int64 followedId = 2;
}

message IsFollowingReply {
  bool follows = 1;
}

message GetFollowingRequest {
  int64 userId = 1;
}

message FollowUser {
  int64 userId = 1;
  string username = 2;
}

message GetFollowingReply {
  repeated FollowUser users = 1;
}