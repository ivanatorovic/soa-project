syntax = "proto3";

option java_package = "com.soa.blog_service.grpc";
option java_multiple_files = true;
option go_package = "api-gateway/proto";

package blog;

service BlogRpcService {
  rpc CreateComment (CreateCommentGrpcRequest) returns (CommentGrpcResponse) {}
  rpc GetCommentsByBlogId (GetCommentsByBlogIdGrpcRequest) returns (GetCommentsGrpcResponse) {}
}

message CreateCommentGrpcRequest {
  string blogId = 1;
  string text = 2;
  int64 authorId = 3;
  string authorUsername = 4;
  string role = 5;
}

message GetCommentsByBlogIdGrpcRequest {
  string blogId = 1;
}

message CommentGrpcResponse {
  string id = 1;
  string blogId = 2;
  int64 authorId = 3;
  string authorUsername = 4;
  string text = 5;
  string createdAt = 6;
}

message GetCommentsGrpcResponse {
  repeated CommentGrpcResponse comments = 1;
}