<div class="create-review-page">
  <div class="top-bar">
    <span>Železnička br. 46, 21000 Novi Sad</span>
    <div class="social-links">
      <span>Facebook</span>
      <span>Email</span>
      <span>Twitter</span>
    </div>
  </div>

  <section class="create-review-content">
    <div class="create-review-wrapper">
      <div class="create-review-header">
        <h1>Dodaj recenziju</h1>
        <p>Oceni turu, napiši svoje utiske i dodaj slike sa obilaska.</p>
      </div>

      <div class="create-review-form">
        <div class="form-group">
          <label>Ocena</label>

          <div class="stars-picker">
            <button
              type="button"
              *ngFor="let star of [1, 2, 3, 4, 5]"
              [class.active]="star <= rating"
              (click)="setRating(star)"
            >
              ★
            </button>
          </div>

          <small *ngIf="rating > 0" class="helper-text"> Izabrana ocena: {{ rating }}/5 </small>
        </div>

        <div class="form-group">
          <label for="comment">Komentar</label>
          <textarea
            id="comment"
            [(ngModel)]="comment"
            rows="7"
            placeholder="Napiši svoje utiske o turi..."
          ></textarea>
        </div>

        <div class="form-group">
          <label for="images">Slike</label>

          <label class="upload-box" for="images">
            <span>📷</span>
            <strong>Dodaj slike</strong>
            <small>Možeš izabrati jednu ili više slika sa računara</small>
          </label>

          <input
            id="images"
            type="file"
            accept="image/*"
            multiple
            hidden
            (change)="onImagesSelected($event)"
          />
        </div>

        <div class="preview-grid" *ngIf="imagePreviews.length > 0">
          <div class="preview-item" *ngFor="let preview of imagePreviews; let i = index">
            <img [src]="preview" alt="Preview slike" />
            <button type="button" (click)="removeImage(i)">×</button>
          </div>
        </div>

        <div *ngIf="errorMessage" class="status-message error">
          {{ errorMessage }}
        </div>

        <div *ngIf="successMessage" class="status-message success">
          {{ successMessage }}
        </div>

        <div class="form-actions">
          <button type="button" class="secondary-btn" (click)="goBack()">Nazad</button>

          <button type="button" class="primary-btn" [disabled]="loading" (click)="submitReview()">
            {{ loading ? 'Dodavanje...' : 'Dodaj recenziju' }}
          </button>
        </div>
      </div>
    </div>
  </section>
</div>
