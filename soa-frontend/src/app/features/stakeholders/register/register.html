<div class="register-page">
  <div class="overlay"></div>

  <div class="register-card">
    <p class="register-subtitle">Kreirajte svoj nalog</p>
    <h2>Registracija</h2>

    <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
      <div class="form-group">
        <label for="username">Korisničko ime</label>
        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="username"
          required
          placeholder="Unesite korisničko ime"
        />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          required
          placeholder="Unesite email"
        />
      </div>

      <div class="form-group">
        <label for="password">Lozinka</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          required
          placeholder="Unesite lozinku"
        />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Potvrdi lozinku</label>
        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          required
          placeholder="Ponovo unesite lozinku"
        />
      </div>

      <div class="form-group">
        <label for="role">Uloga</label>
        <select
          id="role"
          name="role"
          [(ngModel)]="role"
        >
          <option value="TOURIST">Turista</option>
          <option value="GUIDE">Vodič</option>
        </select>
      </div>

      <button type="submit" class="register-btn">Registruj se</button>

      <p *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </p>

      <p *ngIf="successMessage" class="success-message">
        {{ successMessage }}
      </p>
    </form>
  </div>
</div>
