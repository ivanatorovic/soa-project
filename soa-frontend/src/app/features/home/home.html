<div class="home-page">
  <div class="top-bar">
    <span *ngIf="!isLoggedIn()">Dobrodošli u aplikaciju</span>
    <span *ngIf="isLoggedIn()">Dobrodošao, {{ getUsername() }}!</span>
  </div>

  <nav class="navbar">
    <div class="logo" routerLink="/">MyApp</div>

    <div class="nav-links" *ngIf="!isLoggedIn()">
      <a routerLink="/">Početna</a>
      <a href="#">O nama</a>
      <a href="#">Kontakt</a>
    </div>

    <div class="nav-links" *ngIf="isLoggedIn()">
      <a routerLink="/">Početna</a>
      <a (click)="goToProfile()">Moj profil</a>
      <a (click)="goToBlog()">Blog</a>
      <a *ngIf="isAdmin()" (click)="goToAdminUsers()">Svi korisnici</a>
      <a class="nav-btn logout" (click)="logout()">Odjava</a>
    </div>
  </nav>

  <section class="hero">
    <div class="overlay"></div>

    <div class="hero-content">
      <p class="subtitle">
        {{ isLoggedIn() ? 'Uspešno ste prijavljeni' : 'Dobrodošli' }}
      </p>

      <h1>
        ISTRAŽI APLIKACIJU,<br />
        PRONAĐI SVOJE MESTO
      </h1>

      <div *ngIf="!isLoggedIn()" class="button-group">
        <button class="btn primary" (click)="goToLogin()">Prijava</button>
        <button class="btn secondary" (click)="goToRegister()">Registracija</button>
      </div>
    </div>
  </section>
</div>
