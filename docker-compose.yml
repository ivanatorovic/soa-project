version: "3.9"

services:
  blog-db:
    image: postgres:15
    container_name: blog-db
    restart: always
    networks:
      - app-network
    environment:
      POSTGRES_DB: blogdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - blog-db-data:/var/lib/postgresql/data

  blog-service:
    build:
      context: ./blog-service
      dockerfile: Dockerfile
    container_name: blog-service
    restart: on-failure
    depends_on:
      - blog-db
    networks:
      - app-network
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://blog-db:5432/blogdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
      SERVER_PORT: 8082
      UPLOAD_DIR: /app/uploads
      FOLLOWER_SERVICE_URL: http://follower-service:5000
    volumes:
      - ./blog-service/uploads:/app/uploads

  stakeholders-db:
    image: postgres:15
    container_name: stakeholders-db
    restart: always
    networks:
      - app-network
    environment:
      POSTGRES_DB: stakeholdersdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - stakeholders-db-data:/var/lib/postgresql/data

  stakeholders-service:
    build:
      context: ./stakeholders-service
      dockerfile: Dockerfile
    container_name: stakeholders-service
    restart: on-failure
    depends_on:
      - stakeholders-db
    networks:
      - app-network
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://stakeholders-db:5432/stakeholdersdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
      SERVER_PORT: 8081
      FOLLOWER_SERVICE_URL: http://follower-service:5000
    volumes:
      - ./stakeholders-service/storage:/app/storage

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    networks:
      - app-network
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - blog-db
      - stakeholders-db
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  follower-db:
    image: neo4j:5
    container_name: follower-db
    restart: always
    networks:
      - app-network
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - follower-neo4j-data:/data

  tours-db:
    image: postgres:15
    container_name: tours-db
    restart: always
    networks:
      - app-network
    environment:
      POSTGRES_DB: toursdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - tours-db-data:/var/lib/postgresql/data

  tours-service:
    build:
      context: ./tour-service
      dockerfile: Dockerfile
    container_name: tours-service
    restart: on-failure
    depends_on:
      - tours-db
    networks:
      - app-network
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://tours-db:5432/toursdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
      SERVER_PORT: 8083

  follower-service:
    build:
      context: ./follower-service
      dockerfile: Dockerfile
    container_name: follower-service
    restart: on-failure
    depends_on:
      - follower-db
    networks:
      - app-network
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_URLS: http://+:5000
      NEO4J_URI: bolt://follower-db:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: password

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: on-failure
    depends_on:
      - stakeholders-service
      - blog-service
      - tours-service
      - follower-service

    networks:
      - app-network
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      STAKEHOLDERS_SERVICE_URL: http://stakeholders-service:8081
      BLOG_SERVICE_URL: http://blog-service:8082
      TOURS_SERVICE_URL: http://tours-service:8083
      FOLLOWER_SERVICE_URL: http://follower-service:5000

volumes:
  blog-db-data:
  stakeholders-db-data:
  pgadmin-data:
  tours-db-data:
  follower-neo4j-data:

networks:
  app-network:
    driver: bridge